plugins {
    id 'java'
}

group = 'ru.gelman'
version = 'unspecified'

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}
mainClassName = 'ru.gelman.Main'

jar {
    manifest {
        attributes 'Main-Class': mainClassName
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

application {
    mainClass = mainClassName
}