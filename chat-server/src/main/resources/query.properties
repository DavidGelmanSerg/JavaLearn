#CREATE
create_users_table=CREATE TABLE IF NOT EXISTS Users(\
  id INT PRIMARY_KEY NOT NULL AUTO_INCREMENT, \
  name VARCHAR(50) NOT NULL UNIQUE, \
  password VARCHAR(20) NOT NULL));
create_chats_table=CREATE TABLE IF NOT EXISTS Chats(\
  id INT PRIMARY KEY NOT NULL AUTO_INCREMENT, \
  name VARCHAR(50) NOT NULL, \
  creatorId INT NOT_NULL, \
  FOREIGN KEY(creatorId) REFERENCES Users (id));
create_messages_table=CREATE TABLE IF NOT EXISTS Messages(\
  id INT PRIMARY KEY NOT NULL AUTO_INCREMENT, \
  content VARCHAR(1000) NOT NULL, \
  creationDateTime TIMESTAMP NOT NULL, \
  creatorId INT, \
  chatId INT NOT NULL, \
  FOREIGN KEY (creatorId) REFERENCES Users(id) ON DELETE SET NULL,\
  FOREIGN KEY (chatId) REFERENCES Chats(id) ON DELETE CASCADE);
create_users_chats_table=CREATE TABLE IF NOT EXISTS Users_Chats(\
  userId INT NOT NULL,\
  chatId INT NOT NULL,\
  PRIMARY KEY(userId, chatId),\
  FOREIGN KEY (userId) REFERENCES Users(id) ON DELETE CASCADE,\
  FOREIGN KEY (chatId) REFERENCES Chats(id) ON DELETE CASCADE\
  );
#INSERT
insert_user=INSERT INTO Users VALUES (?, ?);
#SELECT
select_user_by_name=SELECT * FROM Users WHERE name = ?;
select_user_login=SELECT COUNT(*) FROM Users WHERE name = ? and password = ?;
select_user_by_id=SELECT * FROM Users WHERE id = ?;
#EXISTS
exists_user_id=SELECT COUNT(*) FROM Users WHERE id = ?
exists_user_name=SELECT COUNT(*) FROM Users WHERE name = ?
